*{box-sizing:border-box;margin:0;padding:0}

:root{

body{

  overflow:hidden;
  z-index:5;
}

.floating{
  position:absolute;
  bottom:-50px;
  animation:floatUp linear infinite;
  opacity:.8;
}

@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  15%{opacity:.9}
  100%{transform:translateY(-115vh) rotate(360deg);opacity:0}
}

header{
  padding:35px 15px 20px;

}

.top-flower{font-size:35px;animation:sway 3s infinite ease-in-out}
@keyframes sway{50%{transform:rotate(12deg) scale(1.1)}}

.small-title{
  letter-spacing:4px;
  font-size:11px;
  color:#a57a32;
  margin:15px 0;
}

h1{
  font-size:clamp(32px,8vw,49px);
  color:#c74778;
  line-height:1.35;
  text-shadow:1px 2px 0 #fff;
}

.tiles{
  width:min(94%,450px);

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.tile{
  min-height:115px;
  padding:17px 8px;
  border:1px solid #e8c67d;
  border-radius:22px;
  color:#8c3c5c;
  background:linear-gradient(145deg,#fff,#ffe8f0);
  box-shadow:0 5px 15px #c7477815;
  transition:.25s;
}

.tile .emoji{
  font-size:31px;
  display:block;
  margin-bottom:9px;
  animation:bob 2s infinite ease-in-out;
}

@keyframes bob{

}

.tile strong{font-size:16px}

.panel{

}

@keyframes appear{

}

}

}
